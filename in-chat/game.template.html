<div id="gpt-reversi-in-chat">
  <style>
    #gpt-reversi-in-chat{--rv-ink:light-dark(#203c35,#e5eee8);--rv-board:light-dark(#3b775e,#305f4c);--rv-line:light-dark(#294f42,#183d2d);--rv-panel:light-dark(#e0ece4,#263f34);--rv-hint:light-dark(#d3e8b5,#c7e399);font-family:system-ui,sans-serif;color:var(--rv-ink);max-width:580px;margin:auto;padding:8px;color-scheme:light dark}
    #gpt-reversi-in-chat *{box-sizing:border-box}#gpt-reversi-in-chat h2{margin:0 0 12px;font-size:20px;font-weight:500}#gpt-reversi-in-chat .rv-scores{display:flex;justify-content:space-between;gap:12px;margin:14px 0}#gpt-reversi-in-chat .rv-status{padding:12px;background:var(--rv-panel);border-radius:8px;margin:12px 0;line-height:1.6}#gpt-reversi-in-chat .rv-wrap{display:grid;grid-template-columns:18px 1fr;gap:5px}#gpt-reversi-in-chat .rv-files{grid-column:2;display:grid;grid-template-columns:repeat(8,1fr);text-align:center}#gpt-reversi-in-chat .rv-ranks{display:grid;grid-template-rows:repeat(8,1fr);align-items:center;text-align:center}#gpt-reversi-in-chat .rv-board{display:grid;grid-template-columns:repeat(8,1fr);background:var(--rv-line);border:4px solid var(--rv-line);border-radius:6px;gap:1px}#gpt-reversi-in-chat .rv-cell{aspect-ratio:1;min-width:0;position:relative;border:0;background:var(--rv-board);padding:9%;cursor:var(--cursor-interaction,pointer)}#gpt-reversi-in-chat .rv-cell:disabled{cursor:default}#gpt-reversi-in-chat .rv-disc{width:100%;height:100%;border-radius:50%;box-shadow:1px 3px 4px #0005}#gpt-reversi-in-chat .rv-B{background:radial-gradient(circle at 35% 25%,#414843,#101612 75%)}#gpt-reversi-in-chat .rv-W{background:radial-gradient(circle at 35% 25%,#fff,#d4ddd4 85%)}#gpt-reversi-in-chat .rv-hint{width:15%;height:15%;background:var(--rv-hint);border-radius:50%;position:absolute;left:42.5%;top:42.5%}#gpt-reversi-in-chat .rv-error{color:light-dark(#972c25,#ffb7ae);white-space:pre-wrap}#gpt-reversi-in-chat .rv-detail{font-size:12px;line-height:1.7;overflow-wrap:anywhere}#gpt-reversi-in-chat details pre{white-space:pre-wrap;font-size:12px}#gpt-reversi-in-chat [hidden]{display:none}
  </style>
  <h2>GPT対戦オセロ</h2>
  <div class="rv-scores"><span>● あなた <strong data-rv="black">2</strong></span><span>○ GPT <strong data-rv="white">2</strong></span></div>
  <div data-rv="status" class="rv-status" role="status">盤面を準備しています</div>
  <div class="rv-wrap"><div class="rv-files" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div><div class="rv-ranks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span></div><div class="rv-board" data-rv="board" role="group" aria-label="オセロ盤"></div></div>
  <p data-rv="error" class="rv-error" role="alert"></p>
  <button type="button" class="btn" data-rv="retry" hidden>GPTへの依頼を再試行</button>
  <p class="rv-detail" data-rv="detail"></p>
  <details><summary>接続の確認</summary><pre data-rv="diagnostic"></pre></details>
  <script type="application/json" id="gpt-reversi-bootstrap">null</script>
  <script type="application/json" id="gpt-reversi-command">null</script>
</div>
